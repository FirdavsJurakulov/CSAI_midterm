data:
  labels: data/labels.csv
  crops_root: data
  val_own: 0.3           # fraction of own photos held out (grouped by source photo)
  val_external: 0.15     # fraction of external (Commons) crops held out
  image_size: 224

detector:
  weights: yolo11s-seg.pt
  classes: [car, truck, bus]
  conf: 0.5
  min_area_frac: 0.02
  max_border_cut: 0.4
  pad: 0.10

brand:
  backbone: dinov2_vits14
  stage: frozen           # frozen | finetune
  unfreeze_blocks: 2
  epochs: 100
  batch_size: 256
  hidden: 1024
  dropout: 0.5
  own_weight: 3.0         # own Tashkent photos count 3x in the loss (they match test conditions)
  lr_head: 1.0e-3
  lr_backbone: 1.0e-5
  weight_decay: 0.05
  label_smoothing: 0.1
  out: weights/brand_head.pt

colour:
  classes: [white, black, grey, red, blue, green, brown, yellow]
  hist_bins: {h: 18, s: 8, v: 8}
  out: weights/colour.pkl
